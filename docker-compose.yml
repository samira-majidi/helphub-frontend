services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
       args:
        - NEXT_PUBLIC_API_URL=http://helphub-app.me/api
        - NEXT_PUBLIC_SOCKET_URL=http://helphub-app.me
        - NEXT_PUBLIC_APP_NAME=helphub
    container_name: helphub-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    extra_hosts:
      - "host.docker.internal:host-gateway"
